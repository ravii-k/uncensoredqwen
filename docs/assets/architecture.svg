    <text x="164" y="237" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Mac client</text>
    <text x="164" y="261" fill="#a8b5ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Apple Silicon · Python 3.11+</text>
