    <circle cx="968" cy="314" r="4" fill="#c3a8ff"/><text x="982" y="319" fill="#d8e2f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Authenticated llama.cpp server</text>
    <circle cx="968" cy="344" r="4" fill="#c3a8ff"/><text x="982" y="349" fill="#d8e2f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Qwen GGUF weights stay on Kaggle</text>
    <circle cx="968" cy="374" r="4" fill="#c3a8ff"/><text x="982" y="379" fill="#d8e2f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Loopback server protected by API key</text>
  </g>
  <text x="720" y="463" text-anchor="middle" fill="#8190a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Made for personal experimentation · Kaggle session and tunnel URLs are temporary</text>
