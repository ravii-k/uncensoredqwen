    <circle cx="106" cy="344" r="4" fill="#6ee7c5"/><text x="120" y="349" fill="#d8e2f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Local browser UI</text>
    <circle cx="106" cy="374" r="4" fill="#6ee7c5"/><text x="120" y="379" fill="#d8e2f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">API key stored on your Mac</text>
  </g>
