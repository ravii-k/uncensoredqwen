<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">Uncensored Qwen on Kaggle</title>
  <desc id="desc">The QwenFree Mac client connects through a recommended ngrok tunnel or Cloudflare fallback to an authenticated llama.cpp server running the community uncensored Qwen3.8-27B GGUF on Kaggle GPUs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111d31"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7c5"/><stop offset="1" stop-color="#37c9a8"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#87b8ff"/><stop offset="1" stop-color="#6489f5"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3a8ff"/><stop offset="1" stop-color="#9272e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".32"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a5b4fc" opacity=".13"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1440" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="500" rx="28" fill="url(#dots)"/>
  <circle cx="1170" cy="70" r="220" fill="#5eead4" opacity=".035"/>
  <circle cx="140" cy="450" r="260" fill="#818cf8" opacity=".04"/>
  <text x="72" y="72" fill="#74e6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">UNCENSORED QWEN3.8-27B · KAGGLE T4 ×2</text>
  <text x="72" y="120" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750">Your Mac interface. Kaggle GPU horsepower.</text>
  <text x="72" y="151" fill="#a8b5ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Community model weights stay on Kaggle; prompts travel over an authenticated API.</text>
