<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">QwenFree quick start</title>
  <desc id="desc">Run the Kaggle GPU notebook, copy its temporary tunnel command, then connect and start chatting from the Mac.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#edf4fb"/></linearGradient>
    <filter id="lift" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#22334f" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#91a0b5"/></marker>
  </defs>
  <rect width="1200" height="310" rx="24" fill="url(#canvas)"/>
  <text x="56" y="54" fill="#53647b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">THREE STEPS TO YOUR FIRST PROMPT</text>
  <g filter="url(#lift)">
    <rect x="56" y="86" width="318" height="166" rx="18" fill="#fff" stroke="#dbe5ef"/>
    <rect x="80" y="108" width="42" height="42" rx="13" fill="#dcf8ef"/>
    <text x="101" y="136" text-anchor="middle" fill="#087f68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">01</text>
    <text x="138" y="126" fill="#142239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Start the GPU notebook</text>
    <text x="80" y="183" fill="#53647b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Enable T4 ×2, attach your ngrok secret,</text>
    <text x="80" y="204" fill="#53647b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">then run the Kaggle notebook.</text>
  </g>
  <path d="M389 169h42" fill="none" stroke="#91a0b5" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#lift)">
    <rect x="442" y="86" width="318" height="166" rx="18" fill="#fff" stroke="#dbe5ef"/>
    <rect x="466" y="108" width="42" height="42" rx="13" fill="#e6efff"/>
    <text x="487" y="136" text-anchor="middle" fill="#4169ce" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">02</text>
    <text x="524" y="126" fill="#142239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Copy the tunnel command</text>
    <text x="466" y="183" fill="#53647b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">When the server is ready, copy the</text>
    <text x="466" y="204" fill="#53647b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">printed <tspan font-family="SFMono-Regular,Consolas,monospace" fill="#354a69">qwenfree connect</tspan> command.</text>
  </g>
  <path d="M775 169h42" fill="none" stroke="#91a0b5" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#lift)">
    <rect x="828" y="86" width="318" height="166" rx="18" fill="#fff" stroke="#dbe5ef"/>
    <rect x="852" y="108" width="42" height="42" rx="13" fill="#f0e9ff"/>
    <text x="873" y="136" text-anchor="middle" fill="#7954c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">03</text>
    <text x="910" y="126" fill="#142239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Connect and chat</text>
    <text x="852" y="183" fill="#53647b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Run it in Mac Terminal, then launch</text>
    <text x="852" y="204" fill="#354a69" font-family="SFMono-Regular,Consolas,monospace" font-size="13">qwenfree chat</text>
  </g>
  <text x="600" y="284" text-anchor="middle" fill="#78879b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Your tunnel URL and API key are temporary. Keep the Kaggle server cell running while you chat.</text>
</svg>
